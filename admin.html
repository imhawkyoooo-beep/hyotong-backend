<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효통 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#111827;font-family:Arial,"Malgun Gothic",sans-serif}.wrap{max-width:1000px;margin:36px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0}.muted{color:#64748b;font-size:14px;margin:8px 0 22px}.card{background:#fff;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #0f172a0a}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e5e7eb;font-size:14px}th{color:#64748b;font-weight:600}.actions{display:flex;gap:6px;flex-wrap:wrap}button{border:0;border-radius:7px;padding:8px 11px;cursor:pointer;background:#e2e8f0;color:#111827;font-weight:600}.primary{background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#991b1b}.status{font-weight:700}.msg{margin:12px 0;color:#b91c1c;min-height:18px}.topbtn{padding:10px 14px}.empty{color:#64748b;padding:18px;text-align:center}@media(max-width:650px){table,tbody,tr,td{display:block}thead{display:none}tr{padding:10px 0;border-bottom:1px solid #e5e7eb}td{border:0;padding:5px}}
</style></head><body><main class="wrap"><div class="head"><h1>효신통합관리 · 관리자</h1><div><button class="topbtn" onclick="location.href='/'">메인 화면</button> <button class="topbtn" onclick="logout()">로그아웃</button></div></div><p class="muted">대표자 전용 · 직원 계정 승인 및 관리 (대표자 제외 최대 10명)</p><section class="card"><div class="head"><strong>직원 계정 <span id="count"></span></strong><button onclick="load()">새로고침</button></div><div class="msg" id="msg"></div><div id="users"><div class="empty">불러오는 중…</div></div></section><section class="card"><strong>관리 기록</strong><div id="audit" class="muted">불러오는 중…</div></section></main><script>
const msg=document.getElementById('msg');async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/login.html';throw Error('로그인이 필요합니다.')}if(!r.ok)throw Error(d.error||'요청에 실패했습니다.');return d;}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function act(action,username){if(!confirm(`${username} 계정에 ${action==='approve'?'승인':action==='reject'?'가입 거절 및 삭제':action==='suspend'?'정지':'복구'} 작업을 진행할까요?`))return;try{await api('/api/admin/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});msg.style.color='#047857';msg.textContent='처리했습니다.';await load();}catch(e){msg.style.color='#b91c1c';msg.textContent=e.message;}}async function load(){try{const d=await api('/api/admin/users');document.getElementById('count').textContent=`(${d.used}/${d.limit})`;if(!d.users.length)document.getElementById('users').innerHTML='<div class="empty">등록된 직원 계정이 없습니다.</div>';else document.getElementById('users').innerHTML='<table><thead><tr><th>아이디</th><th>상태</th><th>신청일</th><th>관리</th></tr></thead><tbody>'+d.users.map(u=>`<tr><td>${esc(u.username)}</td><td class="status">${u.status==='pending'?'승인 대기':u.status==='approved'?'사용 중':'정지'}</td><td>${esc((u.createdAt||'').replace('T',' ').slice(0,16))}</td><td><div class="actions">${u.status==='pending'?`<button class="primary" onclick="act('approve','${esc(u.username)}')">승인</button><button class="danger" onclick="act('reject','${esc(u.username)}')">거절</button>`:''}${u.status==='approved'?`<button class="danger" onclick="act('suspend','${esc(u.username)}')">정지</button>`:''}${u.status==='suspended'?`<button class="primary" onclick="act('restore','${esc(u.username)}')">복구</button>`:''}<button class="danger" onclick="act('delete','${esc(u.username)}')">삭제</button></div></td></tr>`).join('')+'</tbody></table>';const a=await api('/api/admin/audit');document.getElementById('audit').innerHTML=a.logs.length?a.logs.map(x=>`<div>${esc(x.at.replace('T',' ').slice(0,19))} · ${esc(x.actor)} · ${esc(x.action)} · ${esc(x.target)}</div>`).join(''):'기록이 없습니다.';}catch(e){msg.textContent=e.message;}}async function logout(){try{await fetch('/api/logout',{method:'POST'})}finally{location.href='/login.html'}}api('/api/me').then(d=>{if(d.role!=='admin')location.href='/';else load()}).catch(()=>{});
</script></body></html>
