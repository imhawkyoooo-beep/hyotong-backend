<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효통 직원 회원가입</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Arial,"Malgun Gothic",sans-serif;color:#111827}.card{width:min(440px,calc(100% - 32px));background:white;border-radius:18px;padding:32px;box-shadow:0 12px 40px #0f172a18}h1{margin:0 0 6px;font-size:25px}.sub{color:#64748b;margin-bottom:20px;font-size:14px;line-height:1.6}label{display:block;font-size:13px;margin:14px 0 6px;color:#475569}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{width:100%;margin-top:22px;border:0;border-radius:9px;background:#2563eb;color:white;padding:14px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:14px;color:#b91c1c;font-size:13px;min-height:20px;line-height:1.5}.back{display:block;text-align:center;margin-top:18px;color:#2563eb;font-size:14px;text-decoration:none}
</style></head><body><main class="card"><h1>직원 회원가입 신청</h1><div class="sub">대표자 승인 후 효신통합관리 로그인이 가능합니다.<br>직원 계정은 대표자 외 최대 30명까지 신청할 수 있습니다.</div><form id="signup"><label for="username">사용할 아이디</label><input id="username" name="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,19}" autocomplete="username" required><label for="password">비밀번호 (12자 이상)</label><input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button id="submit">가입 신청</button><div class="msg" id="message" role="alert"></div></form><a class="back" href="/login.html">로그인으로 돌아가기</a></main><script>
const form=document.getElementById('signup'),btn=document.getElementById('submit'),msg=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';if(form.password.value!==form.confirm.value){msg.textContent='비밀번호가 서로 다릅니다.';return;}btn.disabled=true;btn.textContent='신청 중…';try{const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'신청에 실패했습니다.');msg.style.color='#047857';msg.textContent=d.message;form.reset();}catch(e){msg.style.color='#b91c1c';msg.textContent=e.message;}finally{btn.disabled=false;btn.textContent='가입 신청';}});
</script></body></html>
