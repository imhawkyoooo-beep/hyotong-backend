<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>업무보고 · 효신통합관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#1f2937;font-family:Arial,"Malgun Gothic",sans-serif}
header{background:#111827;color:#fff;padding:15px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0}header small{display:block;color:#cbd5e1;font-size:12px;margin-top:3px}
button,a,select,input,textarea{font:inherit}button{cursor:pointer}
.top-actions{display:flex;gap:7px}.top-actions a,.top-actions button{border:1px solid #64748b;border-radius:8px;padding:8px 10px;background:#263449;color:white;text-decoration:none;font-size:13px}
nav{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;overflow-x:auto;position:sticky;top:62px;z-index:4;white-space:nowrap}
nav a{padding:9px 13px;border-radius:8px;background:#f3f4f6;color:#374151;text-decoration:none;font-size:14px}nav a.active{background:#111827;color:#fff}
main{max-width:1000px;margin:auto;padding:18px 14px 50px}.intro{margin:4px 0 15px}.intro h2{margin:0 0 5px;font-size:23px}.muted{color:#64748b;font-size:13px}
.panel{background:white;border:1px solid #e5e7eb;border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px #0f172a08}
.panel h3{margin:0 0 13px;font-size:17px}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}.tabs button{border:1px solid #d1d5db;border-radius:8px;background:#fff;padding:9px 12px;white-space:nowrap;font-size:13px}.tabs button.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:16px;min-width:0}.field.wide{grid-column:1/-1}.field textarea{min-height:85px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #cbd5e1;background:white;color:#1f2937;border-radius:8px;padding:10px 14px;font-size:14px}.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.btn:disabled{opacity:.55}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white;min-width:0;flex:1}
.report{border:1px solid #e5e7eb;border-radius:10px;padding:13px;margin:9px 0;background:#fff}.report-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.report strong{font-size:15px}.pill{display:inline-block;border-radius:99px;background:#e0e7ff;color:#3730a3;padding:3px 8px;font-size:11px;white-space:nowrap}.pill.approved{background:#dcfce7;color:#166534}.pill.rejected,.pill.revision{background:#fef3c7;color:#92400e}
.report p{white-space:pre-wrap;margin:8px 0 0;font-size:13px;color:#475569}.empty{padding:25px;text-align:center;color:#64748b;font-size:14px}.notice{padding:10px 12px;background:#eff6ff;border-radius:8px;color:#1e40af;font-size:13px;margin-bottom:12px}.error{color:#b91c1c}.hidden{display:none!important}
@media(max-width:600px){header{padding:12px 14px}header h1{font-size:17px}.top-actions a,.top-actions button{padding:7px 8px;font-size:12px}nav{top:58px;padding:8px 10px}.form{grid-template-columns:1fr}.field.wide{grid-column:auto}main{padding:14px 10px 40px}.panel{padding:13px}.intro h2{font-size:21px}}
</style>
</head>
<body>
<header><div><h1>효신통합관리 · 업무보고</h1><small id="who">보고서 작성 및 확인</small></div><div class="top-actions"><a href="/erp">메인</a><button type="button" onclick="logout()">로그아웃</button></div></header>
<nav><a href="/erp">대시보드</a><a class="active" href="/reports.html">업무보고</a></nav>
<main>
<div class="intro"><h2>업무보고</h2><div class="muted">휴대폰에서도 현장·직원·주간 업무보고를 작성하고 제출할 수 있습니다.</div></div>
<div id="message" class="notice hidden" role="status"></div>
<section class="panel">
<h3>보고서 작성</h3>
<div class="tabs" id="typeTabs">
<button type="button" class="active" data-type="staff">직원별 업무보고</button>
<button type="button" data-type="site">현장별 업무보고</button>
<button type="button" data-type="weekly">주간 업무보고</button>
</div>
<form id="reportForm">
<div id="fields" class="form"></div>
<div class="actions"><button id="submitBtn" class="btn primary" type="submit">보고서 제출</button><button class="btn" type="reset">입력 지우기</button></div>
</form>
</section>
<section class="panel">
<h3>제출한 업무보고</h3>
<div class="filters"><select id="filterType"><option value="">전체 보고 종류</option><option value="staff">직원별 업무보고</option><option value="site">현장별 업무보고</option><option value="weekly">주간 업무보고</option></select><select id="filterStatus"><option value="">전체 상태</option><option value="submitted">제출</option><option value="approved">승인</option><option value="rejected">반려</option><option value="revision">보완요청</option></select><input id="search" type="search" placeholder="보고 내용 검색"></div>
<div id="reports"><div class="empty">업무보고를 불러오는 중입니다.</div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let meta=null,currentType='staff',allReports=[];
const labels={staff:'직원별 업무보고',site:'현장별 업무보고',weekly:'주간 업무보고'};
const statusNames={submitted:'제출',approved:'승인',rejected:'반려',revision:'보완요청'};
const today=()=>meta?.today||new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(r.status===401){location.replace('/login.html');throw Error('로그인이 필요합니다.')}if(!r.ok)throw Error(d.error||'요청을 처리하지 못했습니다.');return d}
function say(t,bad=false){$('message').textContent=t;$('message').classList.remove('hidden');$('message').classList.toggle('error',bad);window.scrollTo({top:0,behavior:'smooth'});}
function field(k,label,type='text',wide=false,required=false,opts=null,placeholder=''){let html='';if(opts){html='<select name="'+k+'">'+opts.map(x=>'<option value="'+esc(x.value)+'">'+esc(x.label)+'</option>').join('')+'</select>'}else if(type==='textarea'){html='<textarea name="'+k+'" placeholder="'+esc(placeholder)+'" '+(required?'required':'')+'></textarea>'}else{html='<input name="'+k+'" type="'+type+'" '+(required?'required':'')+' '+(placeholder?'placeholder="'+esc(placeholder)+'"':'')+'>'}return '<div class="field '+(wide?'wide':'')+'"><label>'+esc(label)+(required?' *':'')+'</label>'+html+'</div>'}
function renderFields(){
 let h='';
 if(currentType==='staff'){
  h+=field('date','보고일','date',false,true);h+=field('staffName','직원 이름','text',false,false,false,meta.me.username);
  h+=field('dept','부서');h+=field('duty','담당 업무');h+=field('sites','담당 현장 (쉼표로 구분)','text',true,false,false,'예: 현장 A, 현장 B');
  h+=field('projects','관련 사업 (쉼표로 구분)','text',true);h+=field('results','오늘의 주요 실적','textarea',true,true);
  h+=field('inProgress','진행 중인 업무','textarea',true);h+=field('issues','문제점 및 지원 요청','textarea',true);h+=field('plan','향후 계획','textarea',true);
  h+=field('progress','업무 진행률 (%)','number',false,false,false,'0~100');
 }else if(currentType==='site'){
  const sites=(meta.sites||[]).map(x=>({value:x.name,label:x.name+' · '+x.kind}));
  h+=field('date','보고일','date',false,true);h+=sites.length?field('siteName','현장명','select',false,true,sites):field('siteName','현장명','text',false,true,false,'현장명을 입력하세요');
  h+=field('assignee','담당 직원','text',false,false,false,'담당자 아이디');h+=field('content','현장 업무 내용','textarea',true,true);
  h+=field('consult','상담 및 고객 응대','textarea',true);h+=field('consultCount','상담 건수','number');h+=field('contractCount','계약 건수','number');
  h+=field('progress','현장 진행률 (%)','number');h+=field('issues','현장 이슈','textarea',true);h+=field('nextPlan','다음 업무 계획','textarea',true);
 }else{
  h+=field('weekStart','주간 시작일 (월요일)','date',false,true);h+=field('target','주간 목표','number');h+=field('actual','실적','number');
  h+=field('goalText','주간 목표 및 계획','textarea',true);h+=field('resultText','주요 성과','textarea',true,true);
  h+=field('siteStatus','현장별 진행 상황','textarea',true);h+=field('nextPlan','다음 주 계획','textarea',true);
 }
 h+='<div class="field wide"><label><input name="urgent" type="checkbox" style="width:auto;min-height:auto;margin-right:7px">긴급 확인 요청</label></div>';
 $('fields').innerHTML=h;
 const dateInput=$('fields').querySelector('input[type=date]');if(dateInput)dateInput.value=today();
}
function setType(t){currentType=t;document.querySelectorAll('#typeTabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===t));renderFields();}
function readForm(){const f=new FormData($('reportForm')),o={type:currentType};for(const [k,v] of f.entries()){if(k==='sites'||k==='projects')o[k]=String(v).split(',').map(x=>x.trim()).filter(Boolean);else if(['progress','consultCount','contractCount','target','actual'].includes(k))o[k]=v===''?null:Number(v);else o[k]=v;}o.urgent=$('reportForm').elements.urgent.checked;return o;}
async function submitReport(e){e.preventDefault();const btn=$('submitBtn');btn.disabled=true;try{await api('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(readForm())});say('업무보고를 제출했습니다.');$('reportForm').reset();renderFields();await loadReports();}catch(err){say(err.message,true)}finally{btn.disabled=false}}
function renderReports(){const type=$('filterType').value,status=$('filterStatus').value,q=$('search').value.trim().toLowerCase();const rows=allReports.filter(r=>(!type||r.type===type)&&(!status||r.status===status)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));if(!rows.length){$('reports').innerHTML='<div class="empty">표시할 업무보고가 없습니다.</div>';return}
 $('reports').innerHTML=rows.map(r=>'<article class="report"><div class="report-head"><strong>'+esc(r.title||labels[r.type])+'</strong><span class="pill '+esc(r.status)+'">'+esc(statusNames[r.status]||r.statusLabel||'')+'</span></div><div class="muted">'+esc(labels[r.type])+' · 작성자 '+esc(r.authorName||r.author||'')+' · '+esc(r.date||r.weekStart||'')+'</div><p>'+esc(r.results||r.content||r.resultText||r.inProgress||r.plan||'내용 없음')+'</p>'+(r.urgent?'<p class="error">긴급 확인 요청</p>':'')+'</article>').join('');
}
async function loadReports(){const p=new URLSearchParams();if($('filterType').value)p.set('type',$('filterType').value);if($('filterStatus').value)p.set('status',$('filterStatus').value);const d=await api('/api/reports?'+p.toString());allReports=d.reports||[];renderReports();}
async function init(){try{meta=await api('/api/reports/meta');$('who').textContent=(meta.me.role==='admin'?'대표자':'직원')+' · '+meta.me.username;renderFields();await loadReports();}catch(e){$('reports').innerHTML='<div class="empty error">'+esc(e.message)+'</div>';}}
async function logout(){try{await fetch('/api/logout',{method:'POST'})}finally{location.replace('/login.html')}}
document.querySelectorAll('#typeTabs button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));
$('reportForm').addEventListener('submit',submitReport);$('filterType').addEventListener('change',loadReports);$('filterStatus').addEventListener('change',loadReports);$('search').addEventListener('input',renderReports);init();
</script>
</body></html>
